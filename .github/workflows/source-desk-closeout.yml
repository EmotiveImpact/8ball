name: Preserve complete deferred research handoff
on:
  push:
    branches: [ops/source-desk-closeout-20260926]
    paths: [.github/workflows/source-desk-closeout.yml]
permissions:
  contents: write
concurrency:
  group: endstate-research-archive-preservation
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGED: 1cd9aa5b448dd5a3dff4f7632efa15d8bf42968a
      PREVIOUS: 09e32b2be84cf287cb9adf89807bd9cc41ca05c5
      TARGET: backup/research-recovered-2026-09-25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1cd9aa5b448dd5a3dff4f7632efa15d8bf42968a
          fetch-depth: 0
      - name: Restore one historical snapshot and verify every original file
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$STAGED"
          python - <<'PY'
          import base64, hashlib, json, lzma, re, subprocess
          from pathlib import Path
          packed = ''
          decoded = lzma.decompress(base64.b64decode(packed, validate=True))
          assert hashlib.sha256(decoded).hexdigest() == '67763ff8019f826e710f36cd73324c98473889cb062fa5f046be017f52d2866b'
          base_blob = '9572e983cd0e52b23744f8db62b4fd43e21d05a1'
          original = subprocess.check_output(['git','cat-file','blob',base_blob])
          assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest() == base_blob
          lines = original.decode('utf-8').splitlines(keepends=True)
          ops = json.loads(decoded)
          cursor, chunks = 0, []
          for start, end, replacement in ops:
              assert cursor <= start <= end <= len(lines)
              chunks.extend(lines[cursor:start]); chunks.append(replacement); cursor = end
          chunks.extend(lines[cursor:])
          restored = ''.join(chunks).encode('utf-8')
          assert hashlib.sha256(restored).hexdigest() == 'c49c516b1648f77fe40949c73bef4f1db216c49d5df8ecc4dbf7be1b0c016491'
          root = Path('docs/handoff/2026-09-24-endstate-research/original-pack')
          destination = root/'source-of-truth/CURRENT-INTEGRATED-BUILD-CHECKLIST.md'
          assert not destination.exists()
          destination.write_bytes(restored)
          manifest = (root/'MANIFEST.md').read_bytes()
          assert hashlib.sha256(manifest).hexdigest() == '944253e3a5405fd247377fb054207be3dd0f21aa00abd1a5c031311cdf011e9b'
          entries = re.findall(r'^- `([^`]+)` - SHA-256 `([0-9a-f]{64})`$', manifest.decode(), re.M)
          assert len(entries) == 17 and len({p for p, _ in entries}) == 17
          for name, expected in entries:
              path = root/name
              assert path.resolve().is_relative_to(root.resolve())
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, name
          assert {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()} == {name for name,_ in entries} | {'MANIFEST.md'}
          print('Verified all 18 original files against the recovered research archive manifest.')
          PY
          git add -- docs/handoff/2026-09-24-endstate-research/original-pack/source-of-truth/CURRENT-INTEGRATED-BUILD-CHECKLIST.md
          test "$(git diff --cached --name-only)" = 'docs/handoff/2026-09-24-endstate-research/original-pack/source-of-truth/CURRENT-INTEGRATED-BUILD-CHECKLIST.md'
          git diff --exit-code
      - name: Publish only the existing research backup branch
        shell: bash
        run: |
          actual="$(git ls-remote --heads origin "refs/heads/$TARGET" | cut -f1)"
          test "$actual" = "$PREVIOUS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete and verify the 18-file deferred research archive'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD HEAD^{tree}
          echo 'No application branch, main, PR state, model service or deployment was changed.'
