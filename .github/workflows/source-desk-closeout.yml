name: Verify exact Source Desk closeout patch
on:
  push:
    branches: [ops/source-desk-closeout-20260926]
permissions:
  contents: write
jobs:
  verify-and-preserve:
    if: github.repository == 'EmotiveImpact/8ball'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: d27ad600342245d0222b5f4573da8fdcbbf8c1d4
      EXPECTED_TREE: 1560ec43e469953884df6df50206057b903a9c70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d27ad600342245d0222b5f4573da8fdcbbf8c1d4
          fetch-depth: 0
      - name: Recover reviewed bytes and verify exact source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$BASE"
          git show "$GITHUB_SHA:.github/closeout-source.patch.gz.b64" > "$RUNNER_TEMP/reviewed-patch.b64"
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          payload=Path(os.environ['RUNNER_TEMP'],'reviewed-patch.b64').read_text().strip()
          # Correct three identified transport transcription errors. Both the
          # decoded patch hash and resulting Git tree must still match exactly.
          payload=payload.replace('RJPMPMP1pkE','RJPMP1pkE').replace('GjXRzNoMQMQ2Ael','GjXRzNoMQ2Ael').replace('cvX7985/T12','cvX798/T12')
          patch=gzip.decompress(base64.b64decode(payload,validate=True))
          expected='d7357e26ea5d8902c023aa1136ceee5287ec92f24451e7ff4bd3097368ef04ab'
          assert hashlib.sha256(patch).hexdigest()==expected, 'Reviewed patch bytes do not match'
          Path(os.environ['RUNNER_TEMP'],'reviewed.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero "$RUNNER_TEMP/reviewed.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/reviewed.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt 'setuptools==82.0.1'
      - run: python -m playwright install --with-deps chromium
      - name: All eleven native suites and complete code/package checks
        shell: bash
        run: |
          export EIGHTBALL_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python scripts/acceptance.py --mode native --base "$BASE"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - name: Preserve verified source on an isolated branch, never main
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test -z "$(git ls-remote --heads origin refs/heads/fix/source-desk-native-20260926)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Source Desk query refresh race; preserve native acceptance evidence'
          git push origin HEAD:refs/heads/fix/source-desk-native-20260926
          git rev-parse HEAD HEAD^{tree} > artifacts/PUBLISHED-SOURCE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-desk-closeout-native-evidence
          path: artifacts/
          if-no-files-found: ignore
