name: Preserve current source and real Git history (read only)
on:
  push:
    branches: [ops/source-desk-closeout-20260926]
permissions:
  contents: read
jobs:
  backup:
    if: github.repository == 'EmotiveImpact/8ball'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 290e310707cf8bef6caf2508c285312b091bd18b
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and export full fetched Git history
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '290e310707cf8bef6caf2508c285312b091bd18b'
          test "$(git rev-parse HEAD^{tree})" = '214c4835869dbe70f7c6ff6811977e5bb5a62841'
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/8ball-backup"
          git bundle create "$RUNNER_TEMP/8ball-backup/8ball-real-history.bundle" --all
          git bundle verify "$RUNNER_TEMP/8ball-backup/8ball-real-history.bundle" > "$RUNNER_TEMP/8ball-backup/BUNDLE-VERIFICATION.txt" 2>&1
          git for-each-ref --format='%(refname) %(objectname)' > "$RUNNER_TEMP/8ball-backup/REFS.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/8ball-backup/SOURCE.txt"
          git archive --format=zip --prefix=8ball/ --output="$RUNNER_TEMP/8ball-backup/8ball-published-source.zip" HEAD
          cd "$RUNNER_TEMP/8ball-backup"
          sha256sum 8ball-real-history.bundle 8ball-published-source.zip BUNDLE-VERIFICATION.txt REFS.txt SOURCE.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: published-native-closeout-recovery
          path: ${{ runner.temp }}/8ball-backup/
          if-no-files-found: error
