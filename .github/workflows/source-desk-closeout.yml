name: Measure existing V0.2 Qwen planning baseline
on:
  push:
    branches: [ops/source-desk-closeout-20260926]
    paths: ['.github/workflows/source-desk-closeout.yml']
permissions:
  contents: read
jobs:
  fictional-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 290e310707cf8bef6caf2508c285312b091bd18b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Verify unchanged source and public fixture
        run: |
          test "$(git rev-parse HEAD^{tree})" = '214c4835869dbe70f7c6ff6811977e5bb5a62841'
          echo '2529e648df174aaeb560c9282d928bac483707ef366cb69e7eef2091b3f8dbd1  evals/generation-cases.json' | sha256sum --check
          mkdir -p artifacts/generation
          git rev-parse HEAD HEAD^{tree} > artifacts/generation/SOURCE.txt
      - name: Start the previously selected pinned runtime
        run: |
          curl -fL --retry 2 https://github.com/ollama/ollama/releases/download/v0.34.3/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          echo "e83a089fd0cd2f79ee2933cca2085846a2065f497adbc6467c402177c68423f9  $RUNNER_TEMP/ollama.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          rm "$RUNNER_TEMP/ollama.tar.zst"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
          OLLAMA_HOST=127.0.0.1:11434 OLLAMA_NO_CLOUD=1 OLLAMA_NUM_PARALLEL=1 OLLAMA_MODELS="$RUNNER_TEMP/ollama-models" "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/version && break; sleep 1; done
      - name: Explicit isolated download of the existing public development model
        run: ollama pull qwen3.5:4b
      - name: Actual unchanged four-case generation gate
        env:
          EIGHTBALL_OLLAMA_MODEL: qwen3.5:4b
          EIGHTBALL_GRAPH_PROVIDER: ollama_staged
        run: python evals/live_generation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v02-qwen-baseline-20260927
          path: artifacts/generation/
          if-no-files-found: warn
