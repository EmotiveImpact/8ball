name: 8BALL validation
on:
  push:
    branches: [main, feat/outcome-engine-alpha, feat/situation-intelligence-v2]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Product changelog and shared roadmap
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/delivery.py --check
          python scripts/emergence.py --check
          python scripts/changelog.py --check
          if [ -n "$CHANGELOG_BASE" ] && [ "$CHANGELOG_BASE" != "0000000000000000000000000000000000000000" ]; then
            python scripts/changelog.py --check --base "$CHANGELOG_BASE"
            python scripts/emergence.py --check --base "$CHANGELOG_BASE"
          fi
      - run: python -m pip install "setuptools==82.0.1"
      - run: python -m playwright install --with-deps chromium
      - name: Integrated source-bound acceptance (no model calls)
        run: |
          export EIGHTBALL_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python scripts/acceptance.py --mode native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-acceptance-evidence
          path: artifacts/
          if-no-files-found: ignore
