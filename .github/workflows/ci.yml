name: 8BALL validation
on:
  push:
    branches: [main, feat/outcome-engine-alpha, feat/situation-intelligence-v2]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check web/app.js
      - run: for file in web/v2/*.js; do node --check "$file"; done
      - run: python -m compileall -q eightball
      - run: python -m playwright install --with-deps chromium
      - name: Native browser journeys
        run: |
          export EIGHTBALL_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/browser_smoke.py
          python tests/browser_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
          if-no-files-found: ignore
